name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Module contract
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format contract
        shell: bash
        run: |
          set -euo pipefail
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "Go files requiring gofmt:"
            echo "$files"
            gofmt -d $files
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -count=1 ./...
      - name: Linux amd64 build
        run: go build -trimpath -ldflags="-s -w" -o ./bin/astro-answers ./cmd/astroanswers
      - name: Linux arm64 build
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ./bin/astro-answers-linux-arm64 ./cmd/astroanswers
      - name: Core acceptance
        run: >-
          go test ./internal/game
          -run 'TestFragmentationAndScoring|TestStationCollisionCostsOneShieldAndRemovesRock|TestThirdStationHitEndsRun|TestPlayerCanSpellAnyVisibleAsteroid|TestPlayerCanSolveAnyVisibleMathsAsteroid|TestTypingCanSwitchMidAnswer|TestMathsCanSwitchMidAnswer|TestNonQualifyingGameOverReturnsToAttract|TestQualifyingGameOverInitialsReturnToAttract|TestMathsChallengeAvoidsActivePrefixAmbiguity|TestMathsWaveProgression|TestMathsMixedWaveRange|TestDeterministicGameplay|TestCosmeticRandomnessDoesNotChangeGameplay'
          -count=1
